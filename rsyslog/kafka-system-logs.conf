# Format of each line in the Kafka pipeline's input file
$template KafkaLogFormat,"%timegenerated% severity=%syslogseverity-text% hostname=%hostname% program=%programname% message=%msg%\n"

# Forward system logs to the pipeline input, except:
#  - the pipeline's own console output: Kafka/Connect stdout goes to the journal and would
#    otherwise be re-ingested (feedback loop that dominated the data)
#  - authpriv (sudo, su, PAM, polkit): carries full command lines and auth details
# Only this destination is filtered; /var/log/messages and the journal keep everything.
if not ($programname startswith "kafka-" or $programname startswith "connect-"
        or $syslogfacility-text == "authpriv") then {
    action(type="omfile" file="/home/hadoop/kafka/logs.txt" template="KafkaLogFormat")
}
